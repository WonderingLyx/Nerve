Name: "DeepClosing_Nerve_3D"
Devices: !!python/tuple [ 0 ]
Epoch: 50
Dataset:
  dataset_name: Nerve
  batch_size: 3
Model:
  name: "unet"
  input_type: "label"
  args:
    in_chans: 1
    mask_ratio_bg: !!python/tuple [ 0, 0.25 ]
    mask_ratio_fh: !!python/tuple [ 0.25, 0.5 ]
    patch_size: !!python/tuple [[2,4],[2,4],[2,4]]
    is_random_rotate: False
    final_act: "sigmoid"
    network_setting: "default"
  optimizer:
    name: "adamW"
    args:
      lr: 1.0e-3
      betas: !!python/tuple [ 0.9, 0.95 ]
      weight_decay: 0.05
  lr_scheduler:
    name: "cosine annealing" 
    args:
      T_max: 300
      eta_min: 1.0e-4
  SPE:
    target_DHW: !!python/tuple [ 128, 128, 128 ]
    emd_path: /root/shared-nvme/lyx/simple_lookup_embedding.pt
  topo_weight: 1.0e-1
  